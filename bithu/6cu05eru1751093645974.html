<!DOCTYPE html>
<html lang="en">
<head>

  <meta property="og:image" content="https://raw.githubusercontent.com/guiyeuthuong/love/main/img/thongdiepyeuthuong.png">

<body>
<span style="font-family: Lobster;"></span>
<textarea id="noidung" style="display:none;">Từ trước đến giờ, Thịnh là người luôn bên cạnh tui, lắng nghe tớ mệt mỏi, hay hỏ những lúc tui bệnh.  Cậu giống như một phần không thể thiếu trong cuộc sống của tớ. Và tớ muốn nói là cậu muốn tớ đồng ý hay không đồng ý là 1 phần do cậu quyết định. 
Toii thích cậu!!! ❤ ❤ ❤❤❤❤❤❤❤❤❤❤❤❤❤❤</textarea>
<input type="hidden" id="chuky" value="Tân">
<input type="hidden" id="linkanh" value="https://raw.githubusercontent.com/thongdiepyeuthuong/love/main/uploads/1751093643964_IMG_8815.jpeg">

<div class="button" id="dongthu"><span style="font-family: Lobster;">Đóng thư</span></div>
<div class="boicanh" id="boicanh">
  <div id="perspective">
    <div id="bithu" style="transform: rotateX(0deg) rotateY(0deg) scale(1.4);">
      <div class="mat truoc">
        <div id="white">
          <h1><span style="font-family: Lobster;">Gửi người toiii ❤<br>---</span></h1>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/guiyeuthuong/love@main/bithu2a.js"></script>
<audio id="phatnhac" autoplay muted>
  <source src="https://nguoiyeucuatoi.github.io/love/onlylove.mp3" type="audio/mpeg">
</audio>

<script>
  document.addEventListener('click', function () {
    const audio = document.getElementById('phatnhac');
    audio.muted = false;
    audio.play();
  }, { once: true });

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.style.left = Math.random() * window.innerWidth + 'px';
    heart.style.top = '-10px';
    heart.style.animationDuration = (3 + Math.random() * 2) + 's';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }
  setInterval(createHeart, 100);
</script>

</body>
</html>
